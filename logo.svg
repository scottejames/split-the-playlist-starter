<svg width="980" height="300" viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Split the Playlist">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191420"/>
      <stop offset="100%" stop-color="#211a2a"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
    </pattern>
    <linearGradient id="beam" x1="247.5" y1="90.6" x2="371.4" y2="-4.6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0d9ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f0d9ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="980" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="980" height="300" fill="url(#grid)"/>
  <rect x="0" y="294" width="980" height="6" fill="#8b6fe8"/>

  <!-- a track reaching onward -->
  <polygon points="234.3,73.4 260.6,107.7 405.6,40 337.2,-49.2" fill="url(#beam)"/>

  <!-- equalizer, split into three sides -->
  <g transform="translate(170,150)">
    <circle r="112" fill="none" stroke="#8b6fe8" stroke-width="2" opacity="0.35"/>

    <g fill="#8b6fe8">
      <rect x="-94" y="10" width="14" height="40" rx="6"/>
      <rect x="-76" y="-20" width="14" height="70" rx="6"/>
      <rect x="-58" y="0" width="14" height="50" rx="6"/>

      <rect x="-25" y="-35" width="14" height="85" rx="6"/>
      <rect x="-7" y="15" width="14" height="35" rx="6"/>
      <rect x="11" y="-15" width="14" height="65" rx="6"/>

      <rect x="44" y="-5" width="14" height="55" rx="6"/>
      <rect x="62" y="-25" width="14" height="75" rx="6"/>
      <rect x="80" y="5" width="14" height="45" rx="6"/>
    </g>

    <g stroke="#f0d9ff" stroke-width="4" stroke-linecap="round">
      <line x1="-41" y1="-58" x2="-41" y2="62"/>
      <line x1="28" y1="-58" x2="28" y2="62"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="358" y="112" font-size="40" font-weight="700" letter-spacing="6" fill="#8b6fe8">SPLIT THE</text>
    <text x="354" y="212" font-size="106" font-weight="900" letter-spacing="1" fill="#f7f5f0">PLAYLIST</text>
    <line x1="358" y1="230" x2="760" y2="230" stroke="#8b6fe8" stroke-width="4"/>
    <text x="358" y="258" font-size="16" font-weight="600" letter-spacing="3" fill="#9a8aad">WARM-UP &#183; CODING ASSESSMENT</text>
  </g>
</svg>
